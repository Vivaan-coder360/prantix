<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Prantix — Sign In</title>
    <style>
        .signin-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 60px 6vw;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .signin-container h1 {
            color: var(--cyan);
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            margin-bottom: 12px;
        }

        .signin-container .subtitle {
            color: var(--muted);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            text-align: left;
            color: var(--green);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-group input {
            padding: 12px 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: var(--muted);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(77, 240, 255, 0.15);
        }

        .signin-container .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .signin-container .btn.primary {
            background: var(--green);
            color: #04120a;
        }

        .signin-container .btn.primary:hover,
        .signin-container .btn.primary:focus {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(77, 255, 157, 0.35);
        }

        .signin-link {
            margin-top: 24px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .signin-link a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signin-link a:hover {
            color: var(--green);
        }

        @media (max-width: 700px) {
            .signin-container {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="sign-in.html">Sign in</a>
        <a href="about.html">About</a>
    </nav>

    <main>
        <section class="signin-container">

            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to continue building with Prantix</p>

            <form id="signin-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn primary">Sign In</button>
            </form>

            <p class="signin-link">
                Don't have an account? <a href="index.html">Get started here</a>
            </p>

        </section>
    </main>

    <footer>
        <p>© 2026 Prantix</p>
        <a href="t-and-c.html">Terms and conditions apply</a>
    </footer>

    <script>
        document.getElementById('signin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {
                localStorage.setItem('prantix_user', JSON.stringify({ email, loggedIn: true }));
                alert('Welcome back, ' + email + '! You have been signed in.');
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
